<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>자동차 제동거리 시뮬레이터</title>
<style>
  body {
    text-align: center;
    background-color: #eef3f7;
    font-family: 'Arial';
  }
  #road {
    position: relative;
    width: 900px;
    height: 120px;
    background-color: #777;
    margin: 40px auto;
    border-radius: 10px;
    overflow: hidden;
  }
  #car {
    position: absolute;
    left: 0;
    top: 35px;
    width: 70px;
    height: 35px;
    background-color: red;
    border-radius: 5px;
  }
  #controls {
    margin-top: 20px;
  }
  input, select, button {
    margin: 10px;
    padding: 5px 10px;
    font-size: 16px;
  }
  h2 { margin-bottom: 0; }
</style>
</head>
<body>
  <h2>🚗 자동차 제동거리 시뮬레이터</h2>
  <div id="road">
    <div id="car"></div>
  </div>

  <div id="controls">
    <label>속도 (km/h): <input type="number" id="speed" value="60"></label>
    <label>반응시간 (초): <input type="number" id="reaction" value="1.0" step="0.1"></label>
    <label>노면 상태:
      <select id="mu">
        <option value="0.7">건조 도로 (μ=0.7)</option>
        <option value="0.4">젖은 도로 (μ=0.4)</option>
        <option value="0.2">얼음길 (μ=0.2)</option>
      </select>
    </label>
    <button onclick="startSimulation()">시뮬레이션 시작</button>
  </div>

  <p id="info"></p>

<script>
function startSimulation() {
  const v = parseFloat(document.getElementById('speed').value) / 3.6; // km/h -> m/s
  const reaction = parseFloat(document.getElementById('reaction').value);
  const mu = parseFloat(document.getElementById('mu').value);
  const g = 9.8;

  // 계산
  const reactionDist = v * reaction;
  const brakeDist = v * v / (2 * mu * g);
  const totalDist = reactionDist + brakeDist;

  // 결과 표시
  const info = document.getElementById('info');
  info.innerHTML = `
    <b>결과</b><br>
    반응거리: ${reactionDist.toFixed(1)} m<br>
    제동거리: ${brakeDist.toFixed(1)} m<br>
    총 정지거리: ${totalDist.toFixed(1)} m
  `;

  // 애니메이션 관련
  const car = document.getElementById('car');
  const road = document.getElementById('road');
  const roadWidth = road.clientWidth - 70; // 차 크기 제외
  let time = 0;
  let pos = 0;

  // 전체 시간 (반응 + 제동)
  const totalTime = reaction + v / (mu * g);
  const fps = 60;
  const interval = 1000 / fps;
  const pixelsPerMeter = roadWidth / totalDist;

  // 초기화
  clearInterval(window.sim);
  car.style.left = '0px';
  car.style.backgroundColor = 'red';

  window.sim = setInterval(() => {
    time += 1 / fps;

    if (time < reaction) {
      // 반응 시간 동안 감속 없음
      pos = v * time;
    } else {
      const t = time - reaction;
      const decel = mu * g;
      const d = reactionDist + (v * t - 0.5 * decel * t * t);
      pos = Math.min(d, totalDist);
    }

    // 화면 위치 반영
    car.style.left = (pos * pixelsPerMeter) + 'px';

    // 멈춤 처리
    if (pos >= totalDist) {
      clearInterval(window.sim);
      car.style.backgroundColor = 'blue'; // 정지 표시
    }
  }, interval);
}
</script>
</body>
</html>
